[project]
name = "multicam-recorder"
version = "0.1.0"
description = "Windows desktop app for previewing and recording multiple USB webcams at once"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "opencv-python>=4.10,<5",
    "pyside6>=6.8,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[project.scripts]
multicam-recorder = "multicam_recorder.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multicam_recorder"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

